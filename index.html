<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>Pricing Cards</title>
  </head>
  <body>
    <h1 class="text-primary fw-bold text-center m-5">Pricing Cards</h1>
    <div class="container">
      <div class="row">
        <div class="col-lg-4 offset-lg-2 col-md-6">
          <div class="card text-bg-white p-3">
            <div class="card-body">
              <h4 class="fw-bold">Free</h4>
              <p class="text-muted">For Freelancers</p>
              <h1 class="fw-bold mb-5">$0</h1>
              <ul class="list-unstyled">
                <li class="mb-3"><i class="fas fa-check"></i> Single User</li>
                <li class="mb-3">
                  <i class="fas fa-check"></i> 10 Downloads Per Month
                </li>
                <li class="mb-3"><i class="fas fa-check"></i> Faster Files</li>
                <li class="mb-3">
                  <i class="fas fa-check"></i> 25 Custom Packs
                </li>
              </ul>
            </div>
            <button type="button" class="mt-5 btn btn-dark btn-lg btn-block">
              Subscribe
            </button>
          </div>
        </div>
        <div class="col-lg-4 col-md-6">
          <div class="card text-bg-dark p-3">
            <div class="card-body">
              <h4 class="fw-bold">Pro</h4>
              <p class="text-white">For Agencies</p>
              <h1 class="fw-bold mb-5">$100</h1>
              <ul class="list-unstyled">
                <li class="mb-3">
                  <i class="fas fa-check"></i> Unlimited Users
                </li>
                <li class="mb-3">
                  <i class="fas fa-check"></i> Unlimited Downloads
                </li>
                <li class="mb-3">
                  <i class="fas fa-check"></i> Fully-Editable Files
                </li>
                <li class="mb-3">
                  <i class="fas fa-check"></i> 200+ Custom Packs
                </li>
              </ul>
            </div>
            <button type="button" class="mt-5 btn btn-light btn-lg btn-block">
              Subscribe
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
